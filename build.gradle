buildscript {
    

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        jcenter()
        google()
    }
    dependencies {
        

    }
}

allprojects {

    version = '1.0'
    ext {
        appName = "bloons-tower-defence"
    }

    repositories {
        mavenLocal()
        mavenCentral()
        jcenter()
        google()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
    }
}

project(":desktop") {
    apply plugin: "java-library"


    dependencies {
        implementation project(":core")
        api libs.gdx.backend.lwjgl
        api variantOf(libs.gdx.platform) { classifier("natives-desktop") }
        api variantOf(libs.gdx.box2d.platform) { classifier("natives-desktop") }
        api variantOf(libs.gdx.bullet.platform) { classifier("natives-desktop") }
        api libs.gdx.tools
        
    }
}

project(":core") {
    apply plugin: "java-library"


    dependencies {
        api libs.gdx
        api libs.gdx.box2d
        api libs.gdx.bullet
        api libs.box2dlights
        api libs.gdx.ai
        
    }
}
