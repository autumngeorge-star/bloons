buildscript {

    repositories {
        maven { url "https://repo1.maven.org/maven2/" }
        google()
    }
    dependencies {

    }
}

allprojects {

    version = '1.0'
    ext {
        appName = "bloons-tower-defence"
        gdxVersion = '1.9.10'
        roboVMVersion = '2.3.8'
        box2DLightsVersion = '1.4'
        ashleyVersion = '1.7.0'
        aiVersion = '1.8.0'
    }

    repositories {
        maven { url "https://repo1.maven.org/maven2/" }
        google()
    }
}

project(":desktop") {
    apply plugin: "java-library"


    dependencies {
        implementation project(":core")
        api files("${rootDir}/game.jar")
    }
}

project(":core") {
    apply plugin: "java-library"


    dependencies {
        api files("${rootDir}/game.jar")
    }
}
