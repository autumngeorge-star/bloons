buildscript {
    

    repositories {
        mavenLocal()
        mavenCentral()
        google()
    }
    dependencies {
        

    }
}

allprojects {

    version = '1.0'
    ext {
        appName = "bloons-tower-defence"
        gdxVersion = '1.9.10'
        roboVMVersion = '2.3.8'
        box2DLightsVersion = '1.4'
        ashleyVersion = '1.7.0'
        aiVersion = '1.8.0'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        google()
    }
}

project(":desktop") {
    apply plugin: "java-library"


    dependencies {
        implementation project(":core")
        api files("../game.jar")
    }
}

project(":core") {
    apply plugin: "java-library"

    sourceSets {
        main {
            java {
                srcDirs = ['src']
            }
        }
    }

    dependencies {
        api files("../game.jar")
    }

    task testStatus(type: JavaExec) {
        dependsOn compileJava
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.hongbao.bloons.StatusEffectTest'
    }

    test.dependsOn testStatus
}
