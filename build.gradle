buildscript {
    

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        jcenter()
        google()
    }
    dependencies {
        

    }
}

allprojects {

    version = '1.0'
    ext {
        appName = "bloons-tower-defence"
        gdxVersion = '1.9.10'
        roboVMVersion = '2.3.8'
        box2DLightsVersion = '1.4'
        ashleyVersion = '1.7.0'
        aiVersion = '1.8.0'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        jcenter()
        google()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
    }
}

project(":desktop") {
    apply plugin: "java-library"


    dependencies {
        implementation project(":core")
        api files("${project.rootDir}/game.jar")
    }
}

project(":core") {
    apply plugin: "java-library"

    sourceSets {
        main {
            java {
                srcDirs = ["src"]
            }
        }
        test {
            java {
                srcDirs = ["test"]
            }
        }
    }

    dependencies {
        api files("${project.rootDir}/game.jar")
        testImplementation files("/usr/share/gradle-8.8/lib/junit-4.13.2.jar", "/usr/share/gradle-8.8/lib/hamcrest-core-1.3.jar")
    }
}
