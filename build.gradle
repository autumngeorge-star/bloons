buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
    }
}

allprojects {
    version = '1.0'
    ext {
        appName = "bloons-tower-defence"
    }

    repositories {
        mavenCentral()
        google()
    }
}

def gdxLibsDir = file("${rootDir}/libs")
def gdxAllJar = file("${rootDir}/libs/gdx-all.jar")

if (!gdxAllJar.exists()) {
    gdxLibsDir.mkdirs()
    def extractDir = file("${buildDir}/tmp/jar_extract")
    extractDir.mkdirs()
    copy {
        from zipTree(file("${rootDir}/game.jar"))
        into extractDir
        exclude "com/hongbao/**"
    }
    ant.zip(destfile: gdxAllJar, basedir: extractDir)
}

project(":desktop") {
    apply plugin: "java-library"

    dependencies {
        implementation project(":core")
        api files("${rootDir}/libs/gdx-all.jar")
    }
}

project(":core") {
    apply plugin: "java-library"

    dependencies {
        api files("${rootDir}/libs/gdx-all.jar")
    }

    task runMapFactoryTest(type: JavaExec) {
        dependsOn compileTestJava
        mainClass = 'com.hongbao.bloons.MapFactoryTest'
        classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
    }

    check.dependsOn runMapFactoryTest
}
