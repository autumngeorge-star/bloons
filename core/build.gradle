apply plugin: "java"

sourceCompatibility = 8
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

sourceSets {
    main {
        java {
            srcDirs = [ "src/" ]
            exclude "test/**"
        }
        resources {
            srcDirs = [ "assets/" ]
        }
    }
    test {
        java {
            srcDirs = [ "src/test/java/" ]
        }
        resources {
            srcDirs = [ "src/test/resources/" ]
        }
    }
}

test {
    useJUnitPlatform()
}
