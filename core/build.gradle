apply plugin: "java"

sourceCompatibility = 8
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

sourceSets {
    main {
        java {
            srcDirs = [ "src/" ]
            exclude "test/**"
        }
    }
    test {
        java {
            srcDirs = [ "src/test/java" ]
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
