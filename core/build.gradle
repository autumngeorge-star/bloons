apply plugin: "java"

sourceCompatibility = 8
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

sourceSets.main.java.srcDirs = [ "src/" ]
sourceSets.test.java.srcDirs = [ "test/java/" ]

dependencies {
    testImplementation fileTree(dir: "${System.properties['user.home']}/.gradle", include: ['**/junit-4.12.jar', '**/hamcrest-core-1.3.jar'])
}

test {
    workingDir = 'assets'
}
