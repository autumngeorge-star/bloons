apply plugin: "java"

sourceCompatibility = 8
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

sourceSets {
    main {
        java.srcDirs = [ "src/" ]
        resources.srcDirs = [ "assets/" ]
    }
    test {
        java.srcDirs = [ "test/" ]
        resources.srcDirs = [ "assets/" ]
    }
}

test {
    workingDir = file("assets")
}
